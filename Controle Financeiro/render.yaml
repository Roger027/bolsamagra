services:
  - type: web
    name: bolsa-magra
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python iniciar_producao.py
    envVars:
      - key: APP_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: STREAMLIT_COOKIE_SECRET
        sync: false
      - key: AUTHORIZED_EMAILS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
